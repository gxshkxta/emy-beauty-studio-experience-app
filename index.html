<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMY Booking</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/glass.css">
    <link rel="stylesheet" href="styles/mobile.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- Фон -->
    <img src="emy-bgapp.png" id="app-bg" alt="EMY Background">

    <!-- Основен App Контейнер -->
    <main id="app-container">
        <!-- App Хедър -->
        <header class="app-header">
            <h1>EMY</h1>
            <p>beauty studio experience</p>
        </header>

        <!-- Календарен панел -->
        <section id="calendar-view" class="glass-panel">
            <div class="view-header">
                <h2>It's your time ♡</h2>
            </div>
            
            <!-- Тук JS ще рендира календара -->
            <div id="calendar-mount"></div> 
        </section>
        <!-- Форма за клиентски данни (Скрито по подразбиране) -->
        <section id="form-view" class="glass-panel" style="display: none; margin-top: 20px;">
            <div class="view-header" style="margin-bottom: 15px;">
                <h2 style="font-size: 1.3rem;">Твоите данни</h2>
                <p>За да финализираме заявката</p>
            </div>
            <form id="booking-form" class="booking-inputs">
                <div class="form-group">
                    <label for="client-name">Твоето име</label>
                    <div class="input-glass">
                        <i class="fas fa-user"></i>
                        <input type="text" id="client-name" name="name" placeholder="Въведи име" required>
                    </div>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label for="client-phone">Телефон</label>
                    <div class="input-glass">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="client-phone" name="phone" placeholder="+359 ..." required>
                    </div>
                </div>
                <button type="submit" class="btn-gold" style="margin-top: 20px;">
                    <span>ЗАПАЗИ ЧАС</span>
                    <i class="fas fa-chevron-right"></i>
                </button>
            </form>
        </section>

        <!-- Екран за потвърждение (Скрито по подразбиране) -->
        <section id="confirmation-view" class="glass-panel" style="display: none; margin-top: 20px; text-align: center;">
            <div class="view-header" style="margin-bottom: 15px;">
                <div style="font-size: 2.5rem; margin-bottom: 10px;">✨</div>
                <h2>Заявката е изпратена</h2>
                <p>Очаквай потвърждение от EMY Beauty Studio.</p>
            </div>
            <div id="confirmation-details" style="background: rgba(0, 0, 0, 0.2); border-radius: 15px; padding: 15px; text-align: left; font-size: 0.9rem; display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px;">
                <!-- Тук JS ще попълни детайлите -->
            </div>
            <button id="reset-booking-btn" class="btn-gold" style="justify-content: center;">
                <span>НАЧАЛО</span>
            </button>
        </section>

    </main>
<!-- Времеви слотове (Скрито по подразбиране) -->
        <section id="time-view" class="glass-panel" style="display: none; margin-top: 20px;">
            <div class="view-header" style="margin-bottom: 15px;">
                <h2 style="font-size: 1.3rem;">Свободни часове</h2>
                <p id="selected-date-display" style="color: var(--primary-gold);"></p>
            </div>
            <div id="time-mount"></div>
        </section>

        <!-- Процедури (Скрито по подразбиране) -->
        <section id="service-view" class="glass-panel" style="display: none; margin-top: 20px;">
            <div class="view-header" style="margin-bottom: 15px;">
                <h2 style="font-size: 1.3rem;">Избери процедура</h2>
            </div>
            <div id="service-mount"></div>
        </section>
    <!-- Основен JS като модул -->
    <script type="module" src="main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker регистриран успешно:', reg.scope))
                    .catch(err => console.log('Грешка при регистрация на Service Worker:', err));
            });
        }
    </script>
</body>
</html>
